<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>heal — 写给无法送达的人</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <header class="site-header">
    <p class="brand">heal</p>
  </header>
  <main id="app">
    <section id="view-entry" class="view" hidden>
      <h1 class="entry-title">写给这次分开 / 无法送达的人</h1>
      <div class="entry-privacy">
        <p>隐私说明：</p>
        <ul>
          <li>信件仅存本机</li>
          <li>清缓存或换设备会丢失</li>
          <li>访问统计匿名且不含正文</li>
        </ul>
      </div>
      <p class="entry-boundary">本产品不是心理治疗，也不是挽回关系的工具。</p>
      <button type="button" id="btn-start-write" class="btn-primary">开始写信</button>
      <p class="entry-nav">
        <button type="button" id="btn-go-archive" class="link-btn">查看本机已安放</button>
      </p>
      <p class="entry-aid">
        <a href="https://www.crisis.org.cn/" target="_blank" rel="noopener noreferrer">
          心理援助资源（非本产品危机干预）
        </a>
      </p>
    </section>
    <section id="view-write" class="view" hidden>
      <h2 class="write-title">写信</h2>
      <label class="write-label" for="scene">场景</label>
      <select id="scene" class="write-field">
        <option value="分手">分手</option>
        <option value="单恋">单恋</option>
        <option value="不得不分开">不得不分开</option>
        <option value="其他">其他</option>
      </select>
      <div id="prompt-text" class="prompt-text" aria-live="polite"></div>
      <label class="write-label" for="title">标题（可选）</label>
      <input type="text" id="title" class="write-field" maxlength="200" />
      <label class="write-label" for="body">正文</label>
      <textarea id="body" class="write-field write-body" rows="12"></textarea>
      <div class="write-actions">
        <button type="button" id="btn-save-draft" class="btn-secondary">保存草稿</button>
        <button type="button" id="btn-go-seal" class="btn-primary">去封存</button>
        <button type="button" id="btn-back-entry" class="link-btn">返回入口</button>
      </div>
    </section>
    <section id="view-seal" class="view" hidden>
      <h2 class="seal-title">封存仪式</h2>
      <div id="seal-confirm">
        <div class="seal-summary">
          <p><strong>标题：</strong><span id="seal-summary-title">—</span></p>
          <p><strong>场景：</strong><span id="seal-summary-scene"></span></p>
          <p><strong>字数：</strong><span id="seal-summary-count"></span></p>
        </div>
        <details class="seal-preview">
          <summary>预览正文</summary>
          <div id="seal-preview-body" class="seal-preview-body"></div>
        </details>
        <label class="seal-confirm-label">
          <input type="checkbox" id="seal-confirm-check" />
          我确认将此信安放在本机，无法通过本产品发送给对方
        </label>
        <fieldset class="seal-nocontact">
          <legend>可选：不再联系标记（仅本机日期，无推送提醒）</legend>
          <label class="seal-nocontact-option">
            <input type="radio" name="noContactDays" value="" checked />
            不设置
          </label>
          <label class="seal-nocontact-option">
            <input type="radio" name="noContactDays" value="7" />
            7 天
          </label>
          <label class="seal-nocontact-option">
            <input type="radio" name="noContactDays" value="14" />
            14 天
          </label>
          <label class="seal-nocontact-option">
            <input type="radio" name="noContactDays" value="30" />
            30 天
          </label>
        </fieldset>
        <div class="seal-actions">
          <button type="button" id="btn-confirm-seal" class="btn-primary" disabled>确认封存</button>
          <button type="button" id="btn-back-write" class="btn-secondary">返回修改</button>
        </div>
      </div>
      <div id="seal-success" hidden>
        <h2 class="seal-success-title">已安放</h2>
        <p class="seal-boundary">本产品不是心理治疗，也不是挽回关系的工具。</p>
        <p class="seal-aid">
          <a href="https://www.crisis.org.cn/" target="_blank" rel="noopener noreferrer">
            心理援助资源（非本产品危机干预）
          </a>
        </p>
        <div class="seal-actions">
          <button type="button" id="btn-seal-go-archive" class="btn-primary">查看归档</button>
          <button type="button" id="btn-seal-write-another" class="btn-secondary">再写一封</button>
        </div>
      </div>
    </section>
    <section id="view-archive" class="view" hidden></section>
  </main>
  <footer class="site-footer">
    <a id="feedback-mailto" href="mailto:yincuilong@126.com?subject=heal%20%E6%84%8F%E8%A7%81%E5%8F%8D%E9%A6%88">意见反馈</a>
    <span> · </span>
    <button type="button" id="copy-email" data-email="yincuilong@126.com">复制邮箱</button>
  </footer>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
